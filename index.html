<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Trainer App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA 1: BOAS-VINDAS CHAMATIVA -->
    <div id="tela-inicio" class="container-box text-center">
        <h1 class="titulo-destaque">BEM-VINDO(A)!</h1>
        <p class="frase-impacto">Vamos em busca da sua melhor performance? 🔥</p>
        <button id="btn-iniciar" class="btn-primary btn-lg">Vamos prosseguir ➔</button>
    </div>

    <!-- TELA 2: CADASTRO DE PERFIL -->
    <div id="tela-perfil" class="container-box oculto">
        <h2>Monte seu perfil inicial para começar</h2>
        <p class="subtitulo">Preencha seus dados para personalizarmos seu treino.</p>

        <form id="form-aluno">
            <div class="input-group">
                <label for="nome">Seu Nome:</label>
                <input type="text" id="nome" placeholder="Ex: Ana Silva" required>
            </div>

            <div class="input-group-row">
                <div class="input-group">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" placeholder="Ex: 25" required>
                </div>

                <div class="input-group">
                    <label for="peso">Peso Atual (kg):</label>
                    <input type="number" id="peso" step="0.1" placeholder="Ex: 65.5" required>
                </div>
            </div>

            <div class="input-group">
                <label>Qual o seu objetivo principal?</label>
                <div class="objetivos-container">
                    <label class="radio-card">
                        <input type="radio" name="objetivo" value="perda" checked>
                        <span>🔥 Perda de Gordura</span>
                    </label>

                    <label class="radio-card">
                        <input type="radio" name="objetivo" value="ganho">
                        <span>💪 Ganho de Massa</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-primary">Avançar para Metas ➔</button>
        </form>
    </div>

    <!-- TELA 3: CÁLCULO DE METAS -->
    <div id="tela-metas" class="container-box oculto">
        <h2 id="titulo-meta-aluno">Planejamento de Metas</h2>
        <p class="subtitulo">Informe seu objetivo para calcularmos seu ritmo ideal.</p>

        <form id="form-metas">
            <div class="input-group-row">
                <div class="input-group">
                    <label id="label-peso-desejado" for="peso-meta">Peso Desejado (kg):</label>
                    <input type="number" id="peso-meta" step="0.1" placeholder="Ex: 60.0" required>
                </div>

                <div class="input-group">
                    <label for="prazo-meses">Prazo Estimado (em Meses):</label>
                    <input type="number" id="prazo-meses" min="1" max="24" placeholder="Ex: 3" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">Calcular Planejamento 📊</button>
        </form>

        <div id="resultado-meta" class="box-resultado oculto">
            <div id="resumo-calculo-texto"></div>
            <hr class="divisor">
            <button id="btn-acessar-ficha" class="btn-destaque">
                🚀 ACESSAR FICHA DE TREINO DE <span id="nome-destaque-btn">CLIENTE</span>
            </button>
        </div>
    </div>

    <!-- TELA 4: FICHA DE TREINOS -->
    <div id="tela-treinos" class="container-treinos oculto">
        <header class="header-perfil">
            <div class="info-user">
                <h2 id="boas-vindas-user">Ficha de Treino</h2>
                <p id="detalhes-user"></p>
            </div>
            <button id="btn-voltar" class="btn-secundario">Alterar Metas</button>
        </header>

        <!-- CONTAINER DAS FICHAS DINÂMICAS -->
        <div id="fichas-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
